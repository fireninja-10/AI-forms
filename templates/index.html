<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent</title>
    <style>
      :root {
        --panel-bg: rgba(45, 45, 45, 0.5);
        --panel-border: rgba(255, 255, 255, 0.16);
        --panel-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
        --text-main: #f5f5f5;
        --text-soft: rgba(255, 255, 255, 0.72);
        --accent: #79e0a4;
        --accent-off: #7a7a7a;
        --surface: rgba(255, 255, 255, 0.08);
        --surface-strong: rgba(255, 255, 255, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(121, 224, 164, 0.16), transparent 32%),
          radial-gradient(circle at bottom right, rgba(120, 160, 255, 0.12), transparent 28%),
          linear-gradient(160deg, #151515 0%, #1f1f1f 48%, #0f0f0f 100%);
        color: var(--text-main);
      }

      .widget {
        position: fixed;
        top: 72px;
        left: 72px;
        width: min(420px, calc(100vw - 24px));
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: var(--panel-bg);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: var(--panel-shadow);
        user-select: none;
      }

      .widget.off .widget-body {
        display: none;
      }

      .widget.off .status-text {
        color: var(--text-soft);
      }

      .widget-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        cursor: grab;
      }

      .widget-header:active {
        cursor: grabbing;
      }

      .title-wrap {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .orb {
        width: 14px;
        height: 14px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 18px rgba(121, 224, 164, 0.85);
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }

      .widget.off .orb {
        background: var(--accent-off);
        box-shadow: none;
      }

      .title {
        margin: 0;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .status-text {
        margin: 2px 0 0;
        font-size: 0.82rem;
        color: var(--accent);
      }

      .switch {
        position: relative;
        display: inline-flex;
        align-items: center;
        width: 58px;
        height: 32px;
        padding: 3px;
        border: 0;
        border-radius: 999px;
        background: rgba(121, 224, 164, 0.24);
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .widget.off .switch {
        background: rgba(255, 255, 255, 0.16);
      }

      .switch-thumb {
        width: 26px;
        height: 26px;
        border-radius: 999px;
        background: white;
        transform: translateX(26px);
        transition: transform 0.2s ease;
      }

      .widget.off .switch-thumb {
        transform: translateX(0);
      }

      .widget-body {
        padding: 0 18px 18px;
      }

      .messages {
        height: 320px;
        overflow: auto;
        padding: 14px;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      .message {
        max-width: 88%;
        margin-bottom: 10px;
        padding: 10px 12px;
        border-radius: 16px;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .message.user {
        margin-left: auto;
        background: rgba(121, 224, 164, 0.18);
      }

      .message.assistant {
        background: var(--surface);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-top: 14px;
      }

      .input {
        width: 100%;
        min-height: 52px;
        max-height: 140px;
        resize: vertical;
        padding: 14px 16px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-main);
        outline: none;
      }

      .input::placeholder {
        color: rgba(255, 255, 255, 0.5);
      }

      .send {
        align-self: stretch;
        min-width: 110px;
        padding: 0 16px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(180deg, #87ebb0 0%, #5ab786 100%);
        color: #102014;
        font-weight: 700;
        cursor: pointer;
      }

      .send:disabled,
      .widget.off .send,
      .widget.off .input {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .footer {
        margin-top: 10px;
        font-size: 0.8rem;
        color: var(--text-soft);
      }

      @media (max-width: 640px) {
        .widget {
          top: 12px;
          left: 12px;
          width: calc(100vw - 24px);
        }

        .messages {
          height: 260px;
        }

        .controls {
          grid-template-columns: 1fr;
        }

        .send {
          min-height: 48px;
        }
      }
    </style>
  </head>
  <body>
    <section class="widget" id="widget">
      <div class="widget-header" id="dragHandle">
        <div class="title-wrap">
          <div class="orb"></div>
          <div>
            <p class="title">AI Agent</p>
            <p class="status-text" id="statusText">En ligne</p>
          </div>
        </div>
        <button class="switch" id="powerSwitch" type="button" aria-label="Activer ou desactiver l'agent">
          <span class="switch-thumb"></span>
        </button>
      </div>

      <div class="widget-body">
        <div class="messages" id="messages">
          <div class="message assistant">
            Salut, je suis prêt. Déplace cette boîte en cliquant sur son en-tête.
          </div>
        </div>

        <div class="controls">
          <textarea
            class="input"
            id="messageInput"
            placeholder="Ecris ton message..."
          ></textarea>
          <button class="send" id="sendButton" type="button">Envoyer</button>
        </div>

        <div class="footer">Switch sur off: la boîte reste visible, mais l'agent ne répond plus.</div>
      </div>
    </section>

    <script>
      const widget = document.getElementById("widget");
      const dragHandle = document.getElementById("dragHandle");
      const powerSwitch = document.getElementById("powerSwitch");
      const statusText = document.getElementById("statusText");
      const messages = document.getElementById("messages");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");

      let isOn = true;
      let isDragging = false;
      let pendingDrag = false;
      let dragPointerId = null;
      let dragOffsetX = 0;
      let dragOffsetY = 0;
      let startX = 0;
      let startY = 0;
      const dragThreshold = 6;
      const history = [];

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function setPowerState(nextState) {
        isOn = nextState;
        widget.classList.toggle("off", !isOn);
        statusText.textContent = isOn ? "En ligne" : "Hors ligne";
        messageInput.disabled = !isOn;
        sendButton.disabled = !isOn;
      }

      function resetDragState() {
        pendingDrag = false;
        isDragging = false;
        dragPointerId = null;
      }

      function appendMessage(role, content) {
        const item = document.createElement("div");
        item.className = `message ${role}`;
        item.textContent = content;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
      }

      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!isOn || !message) {
          return;
        }

        appendMessage("user", message);
        history.push({ role: "user", content: message });
        messageInput.value = "";
        sendButton.disabled = true;

        try {
          const response = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, history: history.slice(0, -1) }),
          });

          const payload = await response.json();
          if (!response.ok) {
            throw new Error(payload.error || "Erreur inconnue");
          }

          appendMessage("assistant", payload.reply);
          history.push({ role: "assistant", content: payload.reply });
        } catch (error) {
          appendMessage("assistant", `Erreur: ${error.message}`);
        } finally {
          sendButton.disabled = !isOn;
          messageInput.focus();
        }
      }

      powerSwitch.addEventListener("click", () => {
        setPowerState(!isOn);
      });

      sendButton.addEventListener("click", sendMessage);

      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      dragHandle.addEventListener("pointerdown", (event) => {
        if (event.target.closest("button")) {
          return;
        }

        pendingDrag = true;
        isDragging = false;
        dragPointerId = event.pointerId;
        startX = event.clientX;
        startY = event.clientY;
        dragOffsetX = event.clientX - widget.offsetLeft;
        dragOffsetY = event.clientY - widget.offsetTop;
        dragHandle.setPointerCapture(event.pointerId);
      });

      dragHandle.addEventListener("pointermove", (event) => {
        if (event.pointerId !== dragPointerId) {
          return;
        }

        if (pendingDrag) {
          const movedX = Math.abs(event.clientX - startX);
          const movedY = Math.abs(event.clientY - startY);
          if (movedX < dragThreshold && movedY < dragThreshold) {
            return;
          }
          pendingDrag = false;
          isDragging = true;
        }

        if (!isDragging) {
          return;
        }

        const nextLeft = clamp(
          event.clientX - dragOffsetX,
          0,
          window.innerWidth - widget.offsetWidth
        );
        const nextTop = clamp(
          event.clientY - dragOffsetY,
          0,
          window.innerHeight - widget.offsetHeight
        );

        widget.style.left = `${nextLeft}px`;
        widget.style.top = `${nextTop}px`;
      });

      dragHandle.addEventListener("pointerup", (event) => {
        if (event.pointerId !== dragPointerId) {
          return;
        }

        if (dragHandle.hasPointerCapture(event.pointerId)) {
          dragHandle.releasePointerCapture(event.pointerId);
        }
        resetDragState();
      });

      dragHandle.addEventListener("pointercancel", (event) => {
        if (event.pointerId !== dragPointerId) {
          return;
        }
        resetDragState();
      });

      dragHandle.addEventListener("lostpointercapture", () => {
        resetDragState();
      });

      setPowerState(true);
    </script>
  </body>
</html>
